
name: Build Document Merger

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --platforms=android,windows --project-name=document_merger .
      - name: Set Android compileSdk
        run: |
          sed -i 's/flutter.compileSdkVersion = 34/flutter.compileSdkVersion = 36/' android/build.gradle
          sed -i 's/compileSdkVersion 34/compileSdkVersion 36/' android/app/build.gradle
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: document-merger-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --platforms=android,windows --project-name=document_merger .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath document-merger-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: document-merger-windows
          path: document-merger-windows.zip

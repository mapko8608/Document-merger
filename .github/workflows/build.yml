
name: Build Document Merger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --platforms=android,windows --project-name=document_merger .

      - name: Set Android compileSdk
        run: |
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g; s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' {} +

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: document-merger-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --platforms=android,windows --project-name=document_merger .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: document-merger-windows
          path: build/windows/**/runner/Release/**
